server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Documents are large. 결재 attachments routinely exceed the 1M default and
    # the resulting 413 looks like a bug rather than a limit.
    client_max_body_size 64m;

    # The SPA renders mdv documents under a strict CSP with no unsafe-inline
    # and no unsafe-eval — mdv works under it, and that line is held rather
    # than loosened (ADR 0008). Fonts are self-hosted, so no font-src host is
    # needed either.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A large export can take a while; the worker is async but the download
        # itself still streams through here.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves clients on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
